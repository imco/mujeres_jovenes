<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actualización de datos — Monitor Mujeres Jóvenes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f3ff;
      color: #1f2340;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(111,79,232,.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 560px;
    }

    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .25rem; }
    .subtitle { font-size: .875rem; color: #6b7280; margin-bottom: 2rem; }

    label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: .35rem; color: #374151; }

    input[type="password"] {
      width: 100%;
      padding: .6rem .85rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1.5rem;
    }
    input[type="password"]:focus { border-color: #6f4fe8; }

    .section-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
      margin-bottom: 1rem;
    }

    .section-btn {
      background: #f4f3ff;
      border: 1.5px solid #e0ddf9;
      border-radius: 8px;
      padding: .55rem .75rem;
      font-size: .78rem;
      font-weight: 600;
      color: #4338ca;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: .4rem;
      transition: background .15s, border-color .15s;
    }
    .section-btn:hover { background: #ede9fe; border-color: #6f4fe8; }
    .section-btn.loading { opacity: .6; pointer-events: none; }
    .section-btn .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #6f4fe8;
      flex-shrink: 0;
    }
    .section-btn.ok .dot  { background: #16a34a; }
    .section-btn.err .dot { background: #dc2626; }

    .sync-all {
      width: 100%;
      padding: .75rem;
      background: #6f4fe8;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .15s;
    }
    .sync-all:hover    { background: #5b3fd6; }
    .sync-all:disabled { background: #a5b4fc; cursor: not-allowed; }

    #log {
      margin-top: 1.5rem;
      background: #1e1b2e;
      color: #a5f3fc;
      border-radius: 10px;
      padding: 1rem 1.1rem;
      font-size: .78rem;
      font-family: monospace;
      min-height: 80px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #log.visible { display: block; }
    .log-ok  { color: #86efac; }
    .log-err { color: #fca5a5; }
    .log-dim { color: #6b7280; }
  </style>
</head>
<body>
<div class="card">
  <h1>Actualización de datos</h1>
  <p class="subtitle">Monitor Mujeres Jóvenes — sincroniza Google Sheets → Vercel Blob</p>

  <label for="pwd">Contraseña de administrador</label>
  <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" />

  <label>Secciones individuales</label>
  <div class="section-grid" id="section-grid">
    <button class="section-btn" data-id="participacion_global"><span class="dot"></span>Participación global</button>
    <button class="section-btn" data-id="brecha_salarial"><span class="dot"></span>Brecha salarial</button>
    <button class="section-btn" data-id="informalidad"><span class="dot"></span>Informalidad ↑ acum.</button>
    <button class="section-btn" data-id="valor_cuidados"><span class="dot"></span>Valor cuidados</button>
    <button class="section-btn" data-id="entidad_enriched"><span class="dot"></span>Entidades</button>
    <button class="section-btn" data-id="cdmx_indicadores"><span class="dot"></span>CDMX alcaldías</button>
  </div>

  <button class="sync-all" id="sync-all">⟳ Sincronizar todo</button>

  <pre id="log"></pre>
</div>

<script>
  const log = document.getElementById('log');

  function logLine(text, type = '') {
    log.classList.add('visible');
    const line = document.createElement('span');
    if (type) line.className = `log-${type}`;
    line.textContent = text + '\n';
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  async function syncSection(sectionId, label) {
    const password = document.getElementById('pwd').value.trim();
    if (!password) { logLine('⚠ Ingresa la contraseña primero.', 'err'); return; }

    logLine(`→ sincronizando ${label}…`, 'dim');
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, section: sectionId }),
    });
    const json = await res.json();

    if (!res.ok || json.errors?.length) {
      const msg = json.errors?.[0]?.error ?? json.error ?? 'Error desconocido';
      logLine(`✗ ${label}: ${msg}`, 'err');
      return false;
    }
    const rows = json.synced?.[0]?.rows ?? '?';
    logLine(`✓ ${label}: ${rows} registros`, 'ok');
    return true;
  }

  // Botones de sección individual
  document.getElementById('section-grid').addEventListener('click', async (e) => {
    const btn = e.target.closest('.section-btn');
    if (!btn) return;
    const id    = btn.dataset.id;
    const label = btn.querySelector('span + *')?.textContent ?? id;  // fallback
    // label from text node
    const btnLabel = btn.textContent.trim();

    btn.classList.add('loading');
    btn.classList.remove('ok', 'err');
    const ok = await syncSection(id, btnLabel);
    btn.classList.remove('loading');
    btn.classList.add(ok ? 'ok' : 'err');
  });

  // Sincronizar todo
  document.getElementById('sync-all').addEventListener('click', async () => {
    const password = document.getElementById('pwd').value.trim();
    if (!password) { logLine('⚠ Ingresa la contraseña primero.', 'err'); return; }

    const btn = document.getElementById('sync-all');
    btn.disabled = true;
    btn.textContent = '⟳ Sincronizando…';
    log.textContent = '';
    log.classList.add('visible');
    logLine('Iniciando sincronización completa…', 'dim');

    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const json = await res.json();

    for (const s of json.synced ?? [])  logLine(`✓ ${s.id}: ${s.rows} registros`, 'ok');
    for (const e of json.errors ?? [])  logLine(`✗ ${e.id}: ${e.error}`, 'err');

    if (!json.errors?.length) logLine('\nTodo listo. Recarga el dashboard para ver los cambios.', 'ok');
    else logLine(`\n${json.synced?.length ?? 0} OK, ${json.errors?.length ?? 0} con error.`, 'err');

    btn.disabled = false;
    btn.textContent = '⟳ Sincronizar todo';
  });
</script>
</body>
</html>
