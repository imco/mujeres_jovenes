<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actualización de datos — Monitor Mujeres Jóvenes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f3ff;
      color: #1f2340;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(111,79,232,.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 540px;
    }

    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: .25rem; }
    .subtitle { font-size: .875rem; color: #6b7280; margin-bottom: 2rem; }

    label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: .35rem; color: #374151; }

    input[type="password"] {
      width: 100%;
      padding: .6rem .85rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 1.75rem;
    }
    input[type="password"]:focus { border-color: #6f4fe8; }

    .tabs-label { font-size: .8rem; font-weight: 600; color: #374151; margin-bottom: .6rem; }

    .tab-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .7rem;
      margin-bottom: 1rem;
    }

    .tab-btn {
      background: #f4f3ff;
      border: 1.5px solid #e0ddf9;
      border-radius: 10px;
      padding: .85rem 1rem;
      font-size: .82rem;
      font-weight: 700;
      color: #4338ca;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: .3rem;
      transition: background .15s, border-color .15s, box-shadow .15s;
      text-align: left;
    }
    .tab-btn:hover   { background: #ede9fe; border-color: #6f4fe8; box-shadow: 0 2px 8px rgba(111,79,232,.12); }
    .tab-btn.loading { opacity: .6; pointer-events: none; }
    .tab-btn.ok      { border-color: #16a34a; background: #f0fdf4; color: #15803d; }
    .tab-btn.err     { border-color: #dc2626; background: #fef2f2; color: #dc2626; }

    .tab-icon { font-size: 1.3rem; line-height: 1; }
    .tab-name { font-size: .85rem; font-weight: 700; }
    .tab-hint { font-size: .7rem; font-weight: 400; color: #6b7280; }
    .tab-btn.ok  .tab-hint { color: #16a34a; }
    .tab-btn.err .tab-hint { color: #dc2626; }

    .dl-btn {
      display: block;
      width: 100%;
      padding: .4rem .6rem;
      margin-top: .35rem;
      background: none;
      border: 1.5px solid #e0ddf9;
      border-radius: 7px;
      font-size: .72rem;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: background .15s, color .15s, border-color .15s;
    }
    .dl-btn:hover { background: #f4f3ff; color: #4338ca; border-color: #c4b5fd; }

    .sync-all {
      width: 100%;
      padding: .8rem;
      background: #6f4fe8;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: .25rem;
      transition: background .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    .sync-all:hover    { background: #5b3fd6; }
    .sync-all:disabled { background: #a5b4fc; cursor: not-allowed; }

    #log {
      margin-top: 1.5rem;
      background: #1e1b2e;
      color: #a5f3fc;
      border-radius: 10px;
      padding: 1rem 1.1rem;
      font-size: .76rem;
      font-family: monospace;
      min-height: 70px;
      max-height: 280px;
      overflow-y: auto;
      display: none;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
    }
    #log.visible { display: block; }
    .log-ok  { color: #86efac; }
    .log-err { color: #fca5a5; }
    .log-dim { color: #6b7280; }

    .imco-logo {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 1.5rem;
    }
    .imco-logo-badge {
      background: #1f2340;
      color: #fff;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      padding: .25rem .55rem;
      border-radius: 5px;
    }
    .imco-logo-text {
      font-size: .75rem;
      color: #9ca3af;
      font-weight: 500;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      font-size: .72rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="imco-logo">
    <span class="imco-logo-badge">IMCO</span>
    <span class="imco-logo-text">Instituto Mexicano para la Competitividad</span>
  </div>
  <h1>Actualización de datos</h1>
  <p class="subtitle">Monitor Mujeres Jóvenes — sincroniza Google Sheets → dashboard</p>

  <label for="pwd">Contraseña de administrador</label>
  <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" />

  <p class="tabs-label">Actualizar por pestaña</p>
  <div class="tab-grid">
    <button class="tab-btn" data-tab="nacionales">
      <span class="tab-icon">🇲🇽</span>
      <span class="tab-name">Resultados nacionales</span>
      <span class="tab-hint">5 secciones</span>
    </button>
    <button class="tab-btn" data-tab="entidades">
      <span class="tab-icon">🗺️</span>
      <span class="tab-name">Resultados por entidad</span>
      <span class="tab-hint">1 sección</span>
    </button>
    <button class="tab-btn" data-tab="cdmx">
      <span class="tab-icon">🏙️</span>
      <span class="tab-name">Resultados CDMX</span>
      <span class="tab-hint">1 sección</span>
    </button>
    <button class="tab-btn" data-tab="stem">
      <span class="tab-icon">🔬</span>
      <span class="tab-name">Resultados STEM</span>
      <span class="tab-hint">6 secciones</span>
    </button>
  </div>

  <a class="dl-btn" href="/api/download" download style="margin-bottom:1rem;">⬇ Descargar plantilla .xlsx (todas las pestañas)</a>

  <button class="sync-all" id="sync-all">⟳ Sincronizar todas las pestañas</button>

  <pre id="log"></pre>
</div>

<footer>Desarrollado por Joel Bravo · IMCO 2025</footer>

<script>
  const logEl = document.getElementById('log');

  const SECTION_NAMES = {
    participacion_global: 'Participación Global',
    tpe_historica:        'TPE Histórica',
    brecha_salarial:      'Brecha Salarial',
    informalidad:         'Informalidad',
    valor_cuidados:       'Valor Cuidados',
    entidad_enriched:     'Resultados por Entidad',
    cdmx_indicadores:     'CDMX Alcaldías',
    stem:                 'STEM',
  };

  function pwd() { return document.getElementById('pwd').value.trim(); }

  function logLine(text, type = '') {
    logEl.classList.add('visible');
    const span = document.createElement('span');
    if (type) span.className = `log-${type}`;
    span.textContent = text + '\n';
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function logSynced(s) {
    const name = SECTION_NAMES[s.id] ?? s.id;
    logLine(`✓ ${name}: ${s.rows} filas`, 'ok');
    if (s.sheets) {
      for (const [sheet, rows] of Object.entries(s.sheets)) {
        logLine(`    • ${sheet}: ${rows} filas`, 'ok');
      }
    }
  }

  async function callSync(body) {
    const res = await fetch('/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pwd(), ...body }),
    });
    return { res, json: await res.json() };
  }

  // Botones por pestaña
  document.querySelector('.tab-grid').addEventListener('click', async (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    if (!pwd()) { logLine('⚠ Ingresa la contraseña primero.', 'err'); return; }

    const tab   = btn.dataset.tab;
    const label = btn.querySelector('.tab-name').textContent;

    btn.classList.add('loading');
    btn.classList.remove('ok', 'err');
    btn.querySelector('.tab-hint').textContent = 'sincronizando…';
    logLine(`\n→ Sincronizando ${label}…`, 'dim');

    const { res, json } = await callSync({ tab });

    btn.classList.remove('loading');

    if (!res.ok || json.errors?.length) {
      btn.classList.add('err');
      btn.querySelector('.tab-hint').textContent = '✗ error';
      for (const e of json.errors ?? []) logLine(`✗ ${SECTION_NAMES[e.id] ?? e.id}: ${e.error}`, 'err');
    } else {
      btn.classList.add('ok');
      const total = json.synced?.reduce((s, x) => s + (x.rows ?? 0), 0) ?? 0;
      btn.querySelector('.tab-hint').textContent = `✓ ${total} filas`;
      for (const s of json.synced ?? []) logSynced(s);
    }
  });

  // Sincronizar todo
  document.getElementById('sync-all').addEventListener('click', async () => {
    if (!pwd()) { logLine('⚠ Ingresa la contraseña primero.', 'err'); return; }

    const btn = document.getElementById('sync-all');
    btn.disabled = true;
    btn.textContent = '⟳ Sincronizando…';
    logEl.textContent = '';
    logEl.classList.add('visible');

    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.remove('ok', 'err');
      const hints = { nacionales: '5 secciones', entidades: '1 sección', cdmx: '1 sección', stem: '6 secciones' };
      b.querySelector('.tab-hint').textContent = hints[b.dataset.tab] ?? '';
    });

    logLine('Iniciando sincronización completa…', 'dim');
    const { res, json } = await callSync({});

    for (const s of json.synced ?? []) logSynced(s);
    for (const e of json.errors ?? []) logLine(`✗ ${SECTION_NAMES[e.id] ?? e.id}: ${e.error}`, 'err');

    const ok  = json.synced?.length ?? 0;
    const err = json.errors?.length ?? 0;
    if (!err) logLine(`\n✓ Todo listo (${ok} secciones). Recarga el dashboard.`, 'ok');
    else      logLine(`\n${ok} OK, ${err} con error.`, 'err');

    btn.disabled = false;
    btn.textContent = '⟳ Sincronizar todas las pestañas';
  });
</script>
</body>
</html>
